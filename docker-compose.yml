services:
  cors-relay:
    image: node:22-alpine
    container_name: cors-relay
    restart: unless-stopped
    command: ["node", "/app/server.js"]
    working_dir: /app
    environment:
      PORT: "8787"
      TIMEOUT_MS: "10000"
      MAX_BYTES: "5000000"
      # Empty = relay any public host. Narrow it here if you ever expose this beyond the LAN.
      ALLOW_HOSTS: ""
    volumes:
      - ./app:/app:ro
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
